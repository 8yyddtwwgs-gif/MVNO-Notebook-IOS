name: MVNONotebook
options:
  bundleIdPrefix: com.mvnonotebook
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MVNONotebook:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvnonotebook.web
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  MVNONotebook:
    build:
      targets:
        MVNONotebook: all
