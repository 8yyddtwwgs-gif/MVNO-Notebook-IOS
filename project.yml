name: MVNONotebook
options:
  bundleIdPrefix: com.mvnonotebook
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  MVNONotebook:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvnonotebook.web
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "내 회선 수첩"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  MVNONotebook:
    build:
      targets:
        MVNONotebook: all
